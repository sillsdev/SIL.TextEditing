name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build everything (libraries, tests, samples)
        run: dotnet build SIL.TextEditing.sln -c Release

      # Each test project targets net48 (Avalonia 11.3.17 through netstandard2.0) and net10.0 (Avalonia 12), except the second-dispatcher tests, which are net10.0 only.
      - name: Test both target frameworks
        run: dotnet test SIL.TextEditing.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  trim-and-aot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Warnings are errors, so a trim or AOT warning in either library fails the publish.
      - name: Publish a net10.0 app that references both libraries with NativeAOT
        run: dotnet publish tests/AotCheck/AotCheck.csproj -c Release -r win-x64

      # Run the published exe: it exercises libpalaso (SLDR init and JSON parsing), which trimming can break silently.
      - name: Run the published app
        run: bin/AotCheck/Release/net10.0/win-x64/publish/AotCheck.exe
